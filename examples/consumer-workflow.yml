name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install AQG (pin a release; use an exact commit SHA for higher assurance)
        run: python -m pip install "git+https://github.com/waelali87/ai-quality-gates.git@v0.1.0"
      - name: Validate AQG records
        run: aqg validate --strict
      - name: Enforce release policy
        run: aqg release-check
